# Local-only dev backend: MongoDB + MinIO (S3-compatible R2 stand-in).
# Fully isolated from production. Bring up with:
#   docker compose -f docker-compose.dev.yml up -d
# Then run the server pointed at these services (see npm run dev:local / README).
services:
  mongo:
    image: mongo:7
    container_name: tdraw-dev-mongo
    ports:
      - "27017:27017"
    volumes:
      - tdraw_dev_mongo:/data/db

  minio:
    image: minio/minio
    container_name: tdraw-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - tdraw_dev_minio:/data

  # One-shot: create the buckets the server expects.
  #   gallery   — images + time-lapse webms
  #   snapshots — board checkpoints (server/r2.js: R2_SNAPSHOTS_BUCKET). WITHOUT
  #               this bucket every checkpoint save fails, SyncCoordinator serves
  #               baseSeq 0, and every join/resync degenerates into a full-tail
  #               replay — which silently invalidates any join- or recovery-parity
  #               measurement taken against this stack.
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo waiting for minio; sleep 1; done;
      /usr/bin/mc mb -p local/gallery;
      /usr/bin/mc anonymous set download local/gallery;
      /usr/bin/mc mb -p local/snapshots;
      /usr/bin/mc anonymous set download local/snapshots;
      echo 'buckets gallery + snapshots ready (public download)';
      exit 0;
      "

volumes:
  tdraw_dev_mongo:
  tdraw_dev_minio:
