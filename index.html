<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Multiplayer Draw</title>
    <meta name="description" content="A collaborative multiplayer drawing application">
    <link id="favicon" rel="icon" href="/images/pepper.ico">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Color Picker Library -->
    <script src="https://unpkg.com/vanilla-picker@2"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz@6..72&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" type="text/css" href="css/style.css">

    <!-- Hammer.js for touch gestures -->
    <script src="/src/utils/hammer.min.js"></script>
  </head>
  <body>
    <div id="main">
      <!-- Login Overlay -->
      <div id="overlay">
        <div id="login" class="overlayWindow" style="display: none;">
          <!-- Auth Tabs -->
          <div class="authTabs" id="authTabs">
            <button class="authTab active" id="authTabLogin">Login</button>
            <button class="authTab" id="authTabRegister">Register</button>
          </div>

          <!-- Login Form -->
          <div id="loginForm">
            <input autocomplete="off" class="authInput" id="loginUsername" placeholder="Username">
            <input autocomplete="off" type="password" class="authInput" id="loginPassword" placeholder="Password (optional)">
            <label class="authCheckbox">
              <input type="checkbox" id="rememberMe">
              <span>Log in Automatically</span>
            </label>
            <div class="authButtons">
              <a class="btn" id="loginBtn">Login</a>
              <a class="btn" id="joinBtn">Join</a>
            </div>
          </div>

          <!-- Register Form -->
          <div id="registerForm" style="display: none;">
            <input autocomplete="off" class="authInput" id="regUsername" placeholder="Username">
            <input autocomplete="off" type="password" class="authInput" id="regPassword" placeholder="Password">
            <input autocomplete="off" type="password" class="authInput" id="regConfirm" placeholder="Confirm Password">
            <div class="authButtons">
              <a class="btn" id="registerBtn">Register</a>
            </div>
          </div>

          <a class="btn offline" id="loginOfflineBtn">Draw Offline</a>
        </div>
        <div id="connecting" class="overlayWindow">
          <label>Connecting to server...</label>
          <a class="btn offline" id="offlineBtn">Draw Offline</a>
        </div>
      </div>

      <!-- Main Drawing Area -->
      <div id="boardContainer">
        <!-- Top Toolbar -->
        <div class="boardBtns">
          <a class="btn" id="clearBtn">Clear</a>
          <a class="btn" id="resetBtn">Reset View</a>

          <div class="zoomBtns">
            <a class="btn" id="minusBtn">-</a>
            <a class="btn" id="plusBtn">+</a>
            <a class="btn" id="rotationResetBtn" title="Reset rotation">&#x21BA;</a>
          </div>
          <span class="zoomPercent">100%</span>

          <a class="btn" id="mirrorBtn">Mirror</a>
          <span class="mirrorOption">OFF</span>

          <a class="btn" id="devBtn">Dev</a>
          <span class="devOption">OFF</span>
          
          <a class="btn modOnly" id="modBtn">Mod</a>
          <div class="right">
            <div id="connectionStatus" class="connectionStatus" style="display: none;">
              <span class="connectionDot"></span>
              <span class="connectionText"></span>
              <a class="btn connectionReconnect" id="reconnectBtn" style="display: none;">Connect</a>
            </div>
            <a class="btn" id="saveBtn">Save Image</a>
            <a class="btn" id="chatBtn">Chat</a>
            <a class="btn" id="disconnectBtn">Exit</a>
          </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast"></div>

        <!-- Selection Context Menu -->
        <div id="selectionMenu" class="selectionMenu" style="display: none;">
          <button class="menuItem" id="selMenuClear" title="Clear selection contents">Clear</button>
          <button class="menuItem" id="selMenuFill" title="Fill with current color">Fill</button>
          <button class="menuItem" id="selMenuCopy" title="Copy selection">Copy</button>
          <button class="menuItem" id="selMenuBrush" title="Use as image brush">Brush</button>
          <button class="menuItem" id="selMenuStamp" title="Stamp to canvas">Stamp</button>
          <button class="menuItem" id="selMenuCancel" title="Cancel and restore">Cancel</button>
        </div>

        <!-- User Context Menu (right-click on user list) -->
        <div id="userContextMenu" class="contextMenu" style="display: none;">
          <button class="menuItem" data-action="sync">Sync Canvas</button>
          <button class="menuItem" data-action="pm">Private Message</button>
          <div class="menuDivider modOnly"></div>
          <button class="menuItem danger modOnly" data-action="mute">Mute</button>
          <button class="menuItem danger modOnly" data-action="kick">Kick</button>
          <button class="menuItem danger modOnly" data-action="ban">Ban</button>
        </div>

        <!-- Canvas Area -->
        <div id="boards">
          <div class="cursors">
            <svg id="cursorsSvg">
              <circle class="circle self"
                  stroke="grey"
                  stroke-width="1"
                  fill="none"
                  cx="0"
                  cy="0"
                  r="10">
              </circle>
              <rect class="square self"
                    stroke="grey"
                    stroke-width="1"
                    fill="none"
                    height="20"
                    width="20"
                    x="10"
                    y="10">
              </rect>
              <g class="crosshair self">
                <line x1="-10" y1="0" x2="10" y2="0" stroke="grey" stroke-width="1"/>
                <line x1="0" y1="-10" x2="0" y2="10" stroke="grey" stroke-width="1"/>
              </g>
              <g class="mutedIndicator self" style="display: none;">
                <circle r="14" cx="0" cy="0" stroke="#ef4444" stroke-width="2" fill="none"/>
                <line x1="-10" y1="10" x2="10" y2="-10" stroke="#ef4444" stroke-width="2"/>
              </g>
              <line class="mirrorLine"
                    x1="0"
                    y1="0"
                    x2="200"
                    y2="200"
                    stroke="grey"
                    stroke-width="1" />
              <div class="cursor self" style="display: none;">
                <text class="text self"><text class="textInput self"></text><text>|</text></text>
                <text class="name self"></text>
              </div>
            </svg>
          </div>

          <div id="userBoards"></div>
          <canvas id="topBoard" class="userBoard self"></canvas>
          <canvas id="board"></canvas>
          <canvas id="debugOverlay"></canvas>
          <div id="syncOverlay" class="sync-overlay">
            <span>Syncing...</span>
          </div>
        </div>

        <!-- Hidden input for touch keyboard (text tool) -->
        <input type="text" id="touchInput" style="position:absolute;opacity:0;pointer-events:none;left:-9999px;" inputmode="text" autocomplete="off">

        <!-- Hidden: Timeline (Not Implemented) -->
        <div id="bottomBar">
          <div class="bottomBarBtns">
            <a class="btn" id="undoBtn">Undo</a>
            <a class="btn" id="showTimelineBtn">^</a>
          </div>
          <div id="timeline"></div>
        </div>
      </div>

      <!-- Side Panel -->
      <div id="sideMenu">
        <!-- Moderation Panel (Floating) -->
        <div id="modPanel" style="display: none;">
          <div id="modPanelHeader">
            <div class="modTabs">
              <button class="modTab active" data-tab="bans">Bans</button>
              <button class="modTab" data-tab="mutes">Mutes</button>
            </div>
            <button class="chatCloseBtn" id="modPanelCloseBtn">&times;</button>
          </div>
          <div id="modEntryList" class="modEntryList">
            <div class="modNoEntries">No entries</div>
          </div>
        </div>

        <!-- Chat Window (Floating) -->
        <div id="chat">
          <div id="chatHeader">
            <div class="chatTabs">
              <button class="chatTab active" id="chatTabAll">Public</button>
              <button class="chatTab" id="chatTabDM">Private</button>
            </div>
            <button class="chatCloseBtn" id="chatCloseBtn">×</button>
          </div>

          <!-- All Messages Tab -->
          <div id="chatMessages">
            <ul id="messageList"></ul>
          </div>

          <!-- DM User List -->
          <div id="chatDMUserList" style="display: none;">
            <div id="dmUserListContent"></div>
          </div>

          <!-- DM Conversation -->
          <div id="chatDMConversation" style="display: none;">
            <div id="chatDMHeader"></div>
            <div id="chatDMMessages">
              <ul id="dmMessageList"></ul>
            </div>
          </div>

          <div class="chatBottom">
            <textarea autocomplete="off" id="chatInput" placeholder="Type a message..." rows="1"></textarea>
            <div class="chatActions">
              <div class="chatActionBtns">
                <button class="chatActionBtn" id="chatAttachBtn" title="Attach image">📎</button>
                <button class="chatActionBtn" id="chatEmojiBtn" title="Emoji">😊</button>
              </div>
              <a class="btn" id="sendMessageBtn">Send</a>
            </div>
          </div>

          <!-- Emoji Picker Popup -->
          <div id="chatEmojiPicker" class="chatEmojiPicker" style="display: none;">
            <div class="emojiRecentRow" id="emojiRecentRow" style="display: none;">
              <label>Recently Used</label>
            </div>
            <div class="emojiPickerGrid" id="emojiPickerGrid"></div>
          </div>

          <!-- Hidden File Input -->
          <input type="file" id="chatFileInput" accept="image/*" style="display: none;">
        </div>

        <!-- Tool Buttons -->
        <div class="tools">
          <a class="tool btn" id="selectBtn" title="Select (S)">
            <img src="/images/select-icon.svg" alt="Select">
          </a>
          <a class="tool btn selected" id="brushBtn" title="Brush (B/P)">
            <img src="/images/brush-icon.svg" alt="Brush">
          </a>
          <a class="tool btn" id="lineBtn" title="Line (L)">
            <img src="/images/line-icon.svg" alt="Line">
          </a>
          <a class="tool btn" id="rectangleBtn" title="Rectangle (R)">
            <img src="/images/rectangle-icon.svg" alt="Rectangle">
          </a>
          <a class="tool btn" id="circleBtn" title="Circle (C)">
            <img src="/images/circle-icon.svg" alt="Circle">
          </a>
          <a class="tool btn" id="textBtn" title="Text (T)">
            <img src="/images/text-icon.svg" alt="Text">
          </a>
          <a class="tool btn" id="eraseBtn" title="Eraser (E)">
            <img src="/images/eraser-icon.svg" alt="Eraser">
          </a>
          <a class="tool btn" id="imageBrushBtn" title="Image Brush (G)">
            <img src="/images/pepper.png" alt="Image Brush">
          </a>
        </div>

        <!-- Tool Options Panel -->
        <div id="toolOptions">
          <!-- Connected Users -->
          <div id="userList">
            <div class="userEntry self">
              <a class="listTool self"></a>
              <a class="listColor self"></a>
              <span class="listUser self">You</span>
              <span class="listActive self"></span>
            </div>
          </div>

          <!-- Brush Options -->
          <div id="options">
            <div class="sliders">
              <div class="sliderContainer">
                <label>Size <span class="sliderValue" id="sizeValue">10</span><button class="lock-btn" id="sizeLock" title="Lock size for current tool">🔓</button></label>
                <input autocomplete="off" type="range" min="0.25" max="100" value="10" step="0.25" class="slider size">
              </div>

              <div class="sliderContainer" id="pressure-container">
                <label>
                  <label class="pressureToggle">
                    <input type="checkbox" id="pressureEnabled" checked>
                    <span>Pressure</span>
                  </label>
                  <span class="sliderValue" id="pressureValue">0-100</span>
                  <button class="lock-btn" id="pressureLock" title="Lock pressure for current tool">🔓</button>
                </label>
                <div class="dual-slider" id="pressureDualSlider">
                  <input autocomplete="off" type="range" min="0" max="100" value="0" class="slider pressureMin" id="pressureMinSlider">
                  <input autocomplete="off" type="range" min="0" max="100" value="100" class="slider pressureMax" id="pressureMaxSlider">
                </div>
              </div>

              <div class="sliderContainer">
                <label>Smoothing <span class="sliderValue" id="smoothingValue">30%</span><button class="lock-btn" id="smoothingLock" title="Lock smoothing for current tool">🔓</button></label>
                <input autocomplete="off" type="range" min="0" max="100" value="30" class="slider smoothing">
              </div>

              <div class="sliderContainer" id="brush-spacing" style="display: none;">
                <label>Spacing <span class="sliderValue" id="spacingValue">0</span><button class="lock-btn" id="spacingLock" title="Lock spacing for current tool">🔓</button></label>
                <input autocomplete="off" type="range" min="0" max="20" value="0" class="slider spacing">
              </div>

              <div class="sliderContainer" id="brush-hardness" style="display: none;">
                <label>Hardness <span class="sliderValue" id="hardnessValue">100</span><button class="lock-btn" id="hardnessLock" title="Lock hardness for current tool">🔓</button></label>
                <input autocomplete="off" type="range" min="0" max="100" value="100" class="slider hardness">
              </div>

              <div class="sliderContainer" id="image-brush-opacity" style="display: none;">
                <label>Opacity <span class="sliderValue" id="imageBrushOpacityValue">100%</span><button class="lock-btn" id="imageBrushOpacityLock" title="Lock opacity for current tool">🔓</button></label>
                <input autocomplete="off" type="range" min="0" max="100" value="100" class="slider imageBrushOpacity">
              </div>

              <input autocomplete="off" type="file" id="brush-file-input" accept=".gih,.gbr,.png,.jpg,.jpeg,.webp" style="display: none;">
              <img id="brushImage" alt="Brush preview" style="display: none;">

              <div id="brushGallery" style="display: none;">
                <label>Brush Gallery</label>
                <div id="brushList"></div>
              </div>
            </div>

            <!-- Selection Mode Options -->
            <div id="selectionModeOptions" style="display: none;">
              <div class="selection-mode-container">
                <label>Selection Mode</label>
                <div class="radio-group">
                  <label class="radio-option">
                    <input type="radio" name="selectionMode" value="lasso" checked>
                    <span>Lasso</span>
                  </label>
                  <label class="radio-option">
                    <input type="radio" name="selectionMode" value="rectangle">
                    <span>Rectangle</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Brush Mode Options -->
            <div id="brushModeOptions" style="display: none;">
              <div class="selection-mode-container">
                <label>Brush Mode</label>
                <div class="radio-group">
                  <label class="radio-option">
                    <input type="radio" name="brushMode" value="fluid" checked>
                    <span>Fluid</span>
                  </label>
                  <label class="radio-option">
                    <input type="radio" name="brushMode" value="classic">
                    <span>Classic</span>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- Color Palette -->
          <div id="colorPalette">
            <div class="paletteSection">
              <label>Recent</label>
              <div class="swatchGrid" id="recentSwatches"></div>
            </div>
            <div class="paletteSection">
              <label>Custom <span class="paletteHint">(click + to save)</span></label>
              <div class="swatchGrid" id="customSwatches">
                <button class="swatch addSwatch" id="addCustomSwatch" title="Save current color">+</button>
              </div>
            </div>
          </div>

          <!-- Color Picker -->
          <div id="pickerContainer">
            <div id="colorPicker"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
