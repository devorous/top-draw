name: k6 Stress Tests

on:
  workflow_dispatch:
    inputs:
      run_low:
        description: 'Run Low Stress Test (8 VUs)'
        required: false
        default: false
        type: boolean
      run_medium:
        description: 'Run Medium Stress Test'
        required: false
        default: false
        type: boolean
      run_high:
        description: 'Run High Stress Test'
        required: false
        default: false
        type: boolean

jobs:
  low_stress_test:
    name: Low Stress Test (10 VUs)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_low == 'true' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run Low Stress Test
        run: k6 run testing/low_stress_test.js
        env:
          TARGET_URL: "wss://top-draw.koyeb.app"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-stress-test-results
          path: |
            *.json
            *.html

  medium_stress_test:
    name: Medium Stress Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_medium == 'true' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run Medium Stress Test
        run: k6 run testing/medium_stress_test.js
        env:
          TARGET_URL: "wss://top-draw.koyeb.app"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-stress-test-results
          path: |
            *.json
            *.html

  high_stress_test:
    name: High Stress Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_high == 'true' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run High Stress Test
        run: k6 run testing/high_stress_test.js
        env:
          TARGET_URL: "wss://top-draw.koyeb.app"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-stress-test-results
          path: |
            *.json
            *.html
