name: k6 Stress Tests

on:
  # Run manually via workflow dispatch
  workflow_dispatch:
    inputs:
      run_medium:
        description: 'Run Medium Stress Test (8 VUs)'
        required: false
        default: true
        type: boolean
      run_hard:
        description: 'Run Hard Stress Test (20 VUs)'
        required: false
        default: false
        type: boolean
      run_basic:
        description: 'Run Basic Stress Test'
        required: false
        default: false
        type: boolean
      run_staged:
        description: 'Run Staged Stress Test (Ramp Up)'
        required: false
        default: false
        type: boolean
  # Or run on schedule (e.g., daily at 2 AM UTC)
  # schedule:
  #   - cron: '0 2 * * *'

jobs:
  medium_stress_test:
    name: Medium Stress Test (8 VUs)
    runs-on: ubuntu-latest
    # Only run if checkbox is selected or on schedule
    if: ${{ github.event.inputs.run_medium == 'true' || github.event_name == 'schedule' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run Medium Stress Test
        run: k6 run testing/medium_stress_test.js
        env:
          TARGET_URL: "wss://top-draw.koyeb.app"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-stress-test-results
          path: |
            *.json
            *.html

  hard_stress_test:
    name: Hard Stress Test (20 VUs)
    runs-on: ubuntu-latest
    # Only run if checkbox is selected
    if: ${{ github.event.inputs.run_hard == 'true' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run Hard Stress Test
        run: k6 run testing/hard_stress_test.js
        env:
          TARGET_URL: "wss://top-draw.koyeb.app"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard-stress-test-results
          path: |
            *.json
            *.html

  basic_stress_test:
    name: Basic Stress Test
    runs-on: ubuntu-latest
    # Only run if checkbox is selected
    if: ${{ github.event.inputs.run_basic == 'true' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run Basic Stress Test
        run: k6 run testing/stress_test.js
        env:
          TARGET_URL: "wss://top-draw.koyeb.app"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-stress-test-results
          path: |
            *.json
            *.html

  staged_stress_test:
    name: Staged Stress Test (Ramp Up)
    runs-on: ubuntu-latest
    # Only run if checkbox is selected
    if: ${{ github.event.inputs.run_staged == 'true' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run Staged Stress Test
        run: k6 run testing/stress_test2.js
        env:
          TARGET_URL: "wss://top-draw.koyeb.app"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-stress-test-results
          path: |
            *.json
            *.html
