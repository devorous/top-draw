name: k6 Stress Test

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Test to run'
        required: true
        default: 'multiroom_stress_test'
        type: choice
        options:
          - multiroom_stress_test
          - low_stress_test
          - low_ordered_stress_test
          - medium_stress_test
          - medium_ordered_stress_test
          - high_stress_test
          - high_ordered_stress_test
      num_vus:
        description: 'Number of virtual users (multiroom test only)'
        required: false
        default: '5'
      num_rooms:
        description: 'Number of rooms to spread across (multiroom test only)'
        required: false
        default: '10'
      room:
        description: 'Room name (single-room tests) / room prefix (multiroom test)'
        required: false
        default: 'stress'

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run k6
        run: |
          k6 run \
            --env TARGET_URL=wss://top-draw.koyeb.app \
            --env ROOM=${{ github.event.inputs.room }} \
            --env ROOM_PREFIX=${{ github.event.inputs.room }} \
            --env NUM_VUS=${{ github.event.inputs.num_vus }} \
            --env NUM_ROOMS=${{ github.event.inputs.num_rooms }} \
            testing/${{ github.event.inputs.test }}.js
