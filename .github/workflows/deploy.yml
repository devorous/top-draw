name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect page
        run: |
          mkdir dist
          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=https://ddraw.ca/go/">
              <link rel="canonical" href="https://ddraw.ca/go/">
              <title>Redirecting to ddraw.ca...</title>
            </head>
            <body>
              <p>This page has moved. <a href="https://ddraw.ca/go/">Click here</a> if you are not redirected.</p>
              <script>window.location.replace("https://ddraw.ca/go/");</script>
            </body>
          </html>
          EOF
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4