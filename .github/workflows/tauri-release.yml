name: Tauri Release

# Auto-trigger disabled — releases handled manually for now.
# To re-enable, restore the push.tags trigger below.
on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Inject updater config
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw
          $config = $config -replace '__TAURI_UPDATER_PUBLIC_KEY__', '${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}'
          $config = $config -replace '__TAURI_UPDATER_ENDPOINT__', "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          Set-Content src-tauri/tauri.conf.json $config

      - name: Publish Tauri release
        uses: tauri-apps/tauri-action@v0.6.0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Top Draw ${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          includeRelease: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.conf.json
